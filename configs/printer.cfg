####################################################################################
# Machine type: OrangeStorm Giga
# Current configuration version: V1.2
# Date：2024-4-20
####################################################################################

[include plr.cfg]
[include znp_mcu.cfg]
[include kcm.cfg]
[include chroma_head.cfg]
#[include input_shaper.cfg]
[include cp_macro.cfg]
[include bed_mesh.cfg]





[duplicate_pin_override]
pins:PC0

[stepper_x]
step_pin:PC14
dir_pin:PC13
enable_pin:!PC15
microsteps: 16
rotation_distance: 59.8519
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:PD0
position_min: -5
position_endstop:815
position_max: 815.5
homing_speed:80
homing_retract_dist:10
second_homing_speed:10
homing_positive_dir:true
step_pulse_duration:0.000002


[stepper_y]
step_pin:PE3
dir_pin:PE2
enable_pin:!PE4
microsteps:16
rotation_distance: 59.8519
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
gear_ratio: 50:20
endstop_pin:PC12
position_min: -1.0
position_endstop:805.0
position_max:805.5
homing_speed:80
homing_retract_dist:10
second_homing_speed:10
homing_positive_dir:true
step_pulse_duration:0.000002

[stepper_z]
step_pin:PB8
dir_pin:PB7
enable_pin: !PB9
microsteps: 16
rotation_distance: 8
gear_ratio: 50:20
full_steps_per_rotation: 200
#endstop_pin:PC11
#position_endstop:0
endstop_pin: probe:z_virtual_endstop
position_max: 1020  # Limit travel: 1050
position_min: -12
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 5
homing_positive_dir:false

[stepper_z1]
step_pin:PB3
dir_pin:PD7
enable_pin: !PB4
microsteps: 16
rotation_distance: 8
gear_ratio: 50:20
full_steps_per_rotation: 200
#endstop_pin:PC10


#[verify_heater extruder]
#max_error: 30
#check_gain_time:10
#hysteresis: 10
#heating_gain: 2

[heater_bed]
heater_pin:PA3
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC3
smooth_time: 0.1
control = pid
pid_Kp  = 70.591 
pid_Ki  = 1.055 
pid_Kd  = 1180.632
min_temp: 0
max_temp: 130

[verify_heater heater_bed]
max_error: 600
check_gain_time:120
hysteresis: 10
heating_gain: 2

[heater_generic heater_bed1]
gcode_id:M108
heater_pin:PA2
max_power:1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin:PC2
smooth_time: 0.1
control = pid
pid_Kp  = 70.591 
pid_Ki  = 1.055 
pid_Kd  = 1180.632
min_temp: 0
max_temp: 130

[verify_heater heater_bed1]
max_error: 600
check_gain_time:120
hysteresis: 10
heating_gain: 2

[heater_generic heater_bed2]
gcode_id:M105
heater_pin:PA1
max_power:1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin:PC1
smooth_time: 0.1
control = pid
pid_Kp  = 70.591 
pid_Ki  = 1.055 
pid_Kd  = 1180.632
min_temp: 0
max_temp: 130

[verify_heater heater_bed2]
max_error: 600
check_gain_time:120
hysteresis: 10
heating_gain: 2

[heater_generic heater_bed3]
gcode_id:M110
heater_pin:PA0
max_power:1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin:PC0
smooth_time: 0.1
control = pid
pid_Kp  = 70.591 
pid_Ki  = 1.055 
pid_Kd  = 1180.632
min_temp: 0
max_temp: 130

[verify_heater heater_bed3]
max_error: 600
check_gain_time:120
hysteresis: 10
heating_gain: 2

[printer]
kinematics:cartesian
max_velocity: 500
max_accel: 5000
#max_accel_to_decel: 5000
max_z_velocity: 20
max_z_accel: 200
square_corner_velocity: 5.0


