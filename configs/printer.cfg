########################################
# TMC UART configuration
########################################
[tmc2209 stepper_x]
uart_pin: PE5
run_current: 1.4  
hold_current: 1.0
interpolate: False
#interpolate: True
#stealthchop_threshold:99999
# driver_SGTHRS:80
# diag_pin:^PD0

[tmc5160 stepper_y]
cs_pin:PE0
spi_software_sclk_pin:PE12
spi_software_mosi_pin:PE14
spi_software_miso_pin:PE13
spi_speed:200000
run_current: 2.8
hold_current: 1.5
sense_resistor: 0.033
interpolate:False
#interpolate:True
#stealthchop_threshold:99999

[tmc2209 stepper_z]
uart_pin: PB5
run_current: 1.0
hold_current: 1.0
#interpolate: True
#stealthchop_threshold: 120

[tmc2209 stepper_z1]
uart_pin: PD5
run_current: 1.0
hold_current: 1.0
#interpolate: True
#stealthchop_threshold: 120




[force_move]
enable_force_move : true



[virtual_sdcard]
path: /home/mks/printer_data/gcodes



 
[display_status]


[delayed_gcode KINEMATIC_POSITION]
initial_duration:0.5
gcode:
      SET_KINEMATIC_POSITION X=110
      SET_KINEMATIC_POSITION Y=110
      SET_KINEMATIC_POSITION Z=0


[gcode_arcs]

[exclude_object]

[controller_fan controller_fan1]
pin: PB0
fan_speed: 1.0
idle_timeout: 3600

